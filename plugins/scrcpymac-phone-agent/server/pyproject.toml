[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrcpymac-phone-agent"
version = "0.5.2"
description = "MCP server for Android phone control via adb"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
scrcpymac-phone-agent-mcp = "phone_agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["phone_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
