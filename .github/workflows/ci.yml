name: CI

on:
  push:
    branches: [master, "cursor/**"]
  pull_request:

jobs:
  macos-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build ScrcpyMac.app
        run: |
          xcodebuild \
            -project ScrcpyMac.xcodeproj \
            -target ScrcpyMac \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  phone-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check launcher scripts
        run: |
          bash -n plugins/scrcpymac-phone-agent/bin/phone-agent
          bash -n plugins/scrcpymac-phone-agent/mcp-server.sh
          bash -n plugins/scrcpymac-phone-agent/scripts/*.sh

      - name: Build embedded widget
        run: plugins/scrcpymac-phone-agent/scripts/build-ui.sh

      - name: Verify embedded widget is current
        run: git diff --exit-code -- plugins/scrcpymac-phone-agent/go/internal/widget/assets/scrcpymac-app.html

      - name: Go checks
        working-directory: plugins/scrcpymac-phone-agent/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Build and smoke Go runtime
        working-directory: plugins/scrcpymac-phone-agent/go
        run: |
          go build -trimpath -o /tmp/phone-agent ./cmd/phone-agent
          PHONE_AGENT_ROOT="$PWD/.." /tmp/phone-agent doctor
          scripts/smoke-stdio.sh /tmp/phone-agent
